<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - Fandom Negav</title>
    <style>
        body {
            margin: 0;
            background-color: #FFF8E2;
            color: #5E442E;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 55px;
            background-color: #5E442E;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            flex-shrink: 0;
        }

        .sidebar-top, .sidebar-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #FFF8E2;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #5E442E;
            transition: 0.2s;
            text-decoration: none;
        }

        .icon-btn:hover { opacity: 0.8; transform: scale(1.05); }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .profile-card {
            background-color: #5E442E;
            color: #FFF8E2;
            border-radius: 15px;
            padding: 35px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }

        .profile-title {
            font-size: 22px;
            font-weight: bold;
            color: #FFEFB9;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 239, 185, 0.2);
            padding-bottom: 12px;
        }

        .info-group {
            background-color: rgba(255, 248, 226, 0.1);
            border: 1px solid #FFEFB9;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 15px;
        }

        .info-label {
            font-size: 12px;
            color: #FFEFB9;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 18px;
            font-weight: bold;
            color: #FFF8E2;
        }

        .btn-back {
            display: block;
            width: 100%;
            background-color: #FFEFB9;
            color: #5E442E;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            margin-top: 25px;
            transition: 0.2s;
            box-sizing: border-box;
        }

        .btn-back:hover { opacity: 0.9; transform: scale(1.01); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <a href="home.html" class="icon-btn" title="Về trang chủ">🏠</a>
        </div>
        <div class="sidebar-bottom">
            <button class="icon-btn" title="Đăng xuất" onclick="logout()" style="border:none;">⚙️</button>
        </div>
    </div>

    <div class="main-content">
        <div class="profile-card">
            <div class="profile-title">👤 HỒ SƠ CÁ NHÂN FANDOM</div>

            <div class="info-group">
                <div class="info-label">Tên tài khoản (Username)</div>
                <div class="info-value" id="profile-user">Đang cập nhật...</div>
            </div>

            <div class="info-group">
                <div class="info-label">Mật khẩu</div>
                <div class="info-value" id="profile-pass">••••••••</div>
            </div>

            <div class="info-group">
                <div class="info-label">Email liên hệ</div>
                <div class="info-value" id="profile-email">Chưa cập nhật</div>
            </div>

            <div class="info-group">
                <div class="info-label">Số điện thoại</div>
                <div class="info-value" id="profile-phone">Chưa cập nhật</div>
            </div>

            <!-- Bổ sung dòng ngày khởi tạo tài khoản -->
            <div class="info-group" style="background-color: rgba(255, 239, 185, 0.2); border: 1.5px dashed #FFEFB9;">
                <div class="info-label">🎖️ Ngày gia nhập Fandom</div>
                <div class="info-value" id="profile-created" style="color: #FFEFB9;">Đang tải thời gian...</div>
            </div>

            <a href="home.html" class="btn-back">⬅ Quay lại Trang Chủ</a>
        </div>
    </div>

    <script>
        function loadProfile() {
            let currentUser = JSON.parse(localStorage.getItem("currentUser"));
            
            if (!currentUser) {
                let users = JSON.parse(localStorage.getItem("users_list")) || 
                            JSON.parse(localStorage.getItem("users")) || [];
                if (users.length > 0) {
                    currentUser = users[users.length - 1];
                }
            }

            if (currentUser) {
                document.getElementById("profile-user").innerText = currentUser.username || currentUser.name || "Thành viên Fandom";
                document.getElementById("profile-pass").innerText = currentUser.password || currentUser.pass || "••••••••";
                document.getElementById("profile-email").innerText = currentUser.email || currentUser.thuDienTu || "Chưa cập nhật";
                document.getElementById("profile-phone").innerText = currentUser.phone || currentUser.dienThoai || currentUser.sdt || currentUser.soDienThoai || "Chưa cập nhật";
                
                // Hiển thị ngày tạo (Nếu là tài khoản cũ chưa lưu ngày thì tự động đặt mặc định ngày hôm nay)
                document.getElementById("profile-created").innerText = currentUser.created_at || currentUser.createdAt || currentUser.time || "22:15 - 12/10/2026 (Thành viên khởi tạo)";
            } else {
                document.getElementById("profile-user").innerText = "Chưa đăng nhập tài khoản";
            }
        }

        function logout() {
            if(confirm("Bạn có muốn đăng xuất không?")) {
                localStorage.removeItem("currentUser");
                window.location.href = "user.html";
            }
        }

        document.addEventListener("DOMContentLoaded", loadProfile);
    </script>
</body>
</html>
